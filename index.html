<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高羽苗 · 商品企划作品集 | 游园之间 BETWEEN GARDENS</title>
<style>
  :root{
    --paper:#EEECE3; --ink:#2b2b28; --moss:#89937B;
    --blue:#351BAD; --clay:#BA8E79; --line:#d8d5c8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:640px; width:100%; text-align:center;
    border:1px solid var(--line); padding:64px 40px;
    background:linear-gradient(180deg,#f4f2ea 0%,var(--paper) 100%);
  }
  .season{
    font-size:12px; letter-spacing:.4em; color:var(--moss);
    text-transform:uppercase; margin-bottom:28px;
  }
  h1{
    font-size:40px; font-weight:600; letter-spacing:.12em; margin-bottom:14px;
  }
  .en{
    font-size:15px; letter-spacing:.28em; color:var(--ink);
    text-transform:uppercase; margin-bottom:10px;
  }
  .sub{
    font-size:14px; color:#6f6f68; line-height:2; margin-bottom:8px;
  }
  .dotline{
    width:48px; height:1px; background:var(--moss);
    margin:34px auto;
  }
  .desc{
    font-size:14px; color:#6f6f68; line-height:2.1; margin-bottom:40px;
  }
  .btn{
    display:inline-block; padding:14px 52px;
    border:1px solid var(--ink); color:var(--ink);
    text-decoration:none; font-size:14px; letter-spacing:.3em;
    transition:all .3s ease;
  }
  .btn:hover{
    background:var(--ink); color:var(--paper);
  }
  .foot{
    margin-top:44px; font-size:11px; color:#9a978c; letter-spacing:.15em;
  }
  .swatches{
    display:flex; justify-content:center; gap:10px; margin-top:26px;
  }
  .swatches span{
    width:14px; height:14px; border-radius:50%; display:block;
  }
</style>
<base target="_blank">
</head>
<body>
  <div class="card">
    <div class="season">2027 SPRING / SUMMER · JNBY 女装商品企划提案</div>
    <h1>游园之间</h1>
    <div class="en">Between Gardens</div>
    <div class="sub">高羽苗 · 商品企划作品集<br>北京服装学院 服装设计硕士 · 2027届</div>
    <div class="dotline"></div>
    <p class="desc">清晨穿过街区，午后走进展厅，傍晚在树影里放慢脚步。<br>把城市的秩序与花园的偶然，穿进同一件衣服。</p>
    <a class="btn" href="portfolio-gaoyumiao.pdf" target="_blank">查看作品集</a>
    <div class="swatches">
      <span style="background:#EEECE3;border:1px solid var(--line)"></span>
      <span style="background:#424743"></span>
      <span style="background:#89937B"></span>
      <span style="background:#351BAD"></span>
      <span style="background:#BA8E79"></span>
    </div>
    <div class="foot">让设计成为可经营的衣橱</div>
  </div>
</body>
</html>
